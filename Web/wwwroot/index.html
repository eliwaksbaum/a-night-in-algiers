<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AlgiersWeb</title>
    <base href="/res/blazor/a-night-in-algiers/" />
    <style>
		body{
			height: calc(100vh - 30px);
			width: calc(100vw - 30px);
			margin: 0;
			padding: 15px;
			background-color: black;
			color: rgb(44, 185, 25);
			font-family: 'Courier New', Courier, monospace;
			font-size: 13pt;
			font-weight: bold;
		}
		#app, .page{
			height: 100%;
			width: 100%;
		}
		#output-div{
			position: relative;
			background-color: black;
			line-height: 22px;
			height: calc(100% - 2em);
		}
		#output-box {
			display: block;
			white-space: pre-wrap;
			word-wrap: break-word;
			margin: 0;
			overflow-y: hidden;
			height: round(down, calc(100%), 22px);

			color: inherit;
			font-family: inherit;
			font-size: inherit;
			font-weight: inherit;
		}
		#input-div {
			width: 100%;
			margin: 0;
			background-color: black;
			color: inherit;
		}
		#input-box {
			height: 2em;
			line-height: 2em;
			padding: 0;
			border: none;
			background-color: inherit;
			width: calc(100% - 2em);

			color: inherit;
			font-family: inherit;
			font-size: inherit;
			font-weight: inherit;
		}
		#input-box:focus-visible {
			outline:none;
		}
		#container{
			position: relative;
			width: 100%;
			height: 100%;
		}
		.loading-text:after {
			content: var(--blazor-load-percentage-text, "0%");
		}
	</style>
</head>

<body>
    <div id="app">
		<div class="loading-text">Loading...</div>
	</div>

    <script>
        function scrollTerminal() {
            var output = document.getElementById("output-box");
            output.scrollTop = output.scrollHeight;
        }

        function focusInput() {
            var input = document.getElementById("input-box");
            input.focus();
        }
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
